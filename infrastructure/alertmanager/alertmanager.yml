
global:
  resolve_timeout: 5m

route:
  receiver: aegisops-webhook
  group_by:
    - alertname
    - service
    - instance
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 1h
  routes:
    - receiver: platform-ops-alerts
      matchers:
        - service = aegisops

receivers:
  - name: aegisops-webhook
    webhook_configs:
      - url: http://host.docker.internal:8000/api/v1/webhooks/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook_token.txt

  - name: platform-ops-alerts
