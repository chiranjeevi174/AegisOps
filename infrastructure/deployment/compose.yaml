name: aegisops-prod

services:
  postgres:
    image: postgres:17-alpine
    container_name: aegisops-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aegisops}
      POSTGRES_USER: ${POSTGRES_USER:-aegisops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in environment}
    volumes:
      - aegisops_prod_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-aegisops} -d $${POSTGRES_DB:-aegisops}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aegisops-prod-net
    # NOTE: PostgreSQL port 5432 is strictly kept internal to aegisops-prod-net and NOT exposed to host.
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  migration:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: aegisops-prod-migration
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: production
      ENVIRONMENT: production
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in environment}
    command: ["python", "scripts/run_migrations.py"]
    networks:
      - aegisops-prod-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: aegisops-prod-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      APP_ENV: production
      ENVIRONMENT: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in environment}
      PROMETHEUS_URL: http://prometheus:9090
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ALERTMANAGER_WEBHOOK_TOKEN: ${ALERTMANAGER_WEBHOOK_TOKEN:?Set ALERTMANAGER_WEBHOOK_TOKEN}
      CSRF_SECRET_KEY: ${CSRF_SECRET_KEY:?Set CSRF_SECRET_KEY}
      HUMAN_AUTH_TOKENS: ${HUMAN_AUTH_TOKENS:-}
      ENABLE_DEV_PERSONA_SWITCHING: "false"
      LIVE_DIAGNOSTICS_ENABLED: ${LIVE_DIAGNOSTICS_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1,frontend}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - aegisops-prod-net
    # Backend port 8000 is internal only; ingress goes through reverse proxy on frontend container
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: aegisops-prod-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HOST_IP:-127.0.0.1}:${APP_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:80/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - aegisops-prod-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: aegisops-prod-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - aegisops_prod_prometheus_data:/prometheus
    ports:
      - "${HOST_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9091}:9090"
    depends_on:
      backend:
        condition: service_started
    networks:
      - aegisops-prod-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: aegisops-prod-alertmanager
    restart: unless-stopped
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    volumes:
      - ../alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ../alertmanager/webhook_token.txt:/etc/alertmanager/webhook_token.txt:ro
      - aegisops_prod_alertmanager_data:/alertmanager
    ports:
      - "${HOST_IP:-127.0.0.1}:${ALERTMANAGER_PORT:-9094}:9093"
    networks:
      - aegisops-prod-net
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  grafana:
    image: grafana/grafana:12.1.1
    container_name: aegisops-prod-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in environment}
    volumes:
      - aegisops_prod_grafana_data:/var/lib/grafana
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "${HOST_IP:-127.0.0.1}:${GRAFANA_PORT:-3001}:3000"
    depends_on:
      prometheus:
        condition: service_started
    networks:
      - aegisops-prod-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  aegisops_prod_postgres_data:
  aegisops_prod_prometheus_data:
  aegisops_prod_grafana_data:
  aegisops_prod_alertmanager_data:

networks:
  aegisops-prod-net:
    driver: bridge
